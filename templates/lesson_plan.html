<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lesson Plan - Teacher Assistant</title><link rel="stylesheet" href="{{ url_for('static', filename='lesson.css') }}"></head>
<body><main class="page"><a class="back" href="{{ url_for('chat_page') }}">← Back to chat</a>
<form id="lesson-form" class="notes-card" autocomplete="off"><p class="eyebrow">TEACHING TOOLS</p><h1>Lesson Plan Details</h1><p class="hint">Choose the curriculum and class, enter your topic, then generate a plan to review and download.</p>
<input id="document_type" name="document_type" type="hidden" value="lesson_plan">
<label for="curriculum">Curriculum</label><select id="curriculum" name="curriculum" required>{% for key, c in cfg.curricula.items() %}<option value="{{ key }}">{{ c.label }}</option>{% endfor %}</select>
<label for="subject">Subject</label><select id="subject" name="subject" required><option value="" disabled selected>Choose a subject</option>{% for s in cfg.subjects %}<option value="{{ s }}">{{ s }}</option>{% endfor %}</select>
<label for="topic">Topic / Sub-topic</label><input id="topic" name="topic" type="text" placeholder="e.g. Materials and manufacturing" required>
<label for="class_name" id="class-label">Class / Grade</label><select id="class_name" name="class_name" required><option value="">Choose curriculum first</option></select>
<label for="duration">Lesson duration</label><select id="duration" name="duration" required>{% for d in cfg.durations %}<option value="{{ d }}">{{ d }} minutes</option>{% endfor %}</select>
<label for="objectives">Learning objectives (optional)</label><textarea id="objectives" name="objectives" rows="3" placeholder="What should learners know or be able to do?"></textarea>
<button type="submit" id="generate-btn" class="notes-btn">Generate Lesson Plan</button><p id="form-error" class="error" role="alert" hidden></p></form>
<section id="preview" class="card" hidden><h2>Review and edit</h2><p class="hint">Review the plan before downloading your Word document.</p><div id="preview-body"></div><div class="download-panel"><button type="button" id="download-btn" class="notes-btn">Download Word file</button><p id="download-error" class="error" role="alert" hidden></p></div></section></main>
<script id="cfg" type="application/json">{{ cfg|tojson }}</script><script src="{{ url_for('static', filename='lesson.js') }}"></script></body></html>
