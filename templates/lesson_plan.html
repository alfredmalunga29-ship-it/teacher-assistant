<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Plan - Teacher Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='lesson.css') }}">
</head>
<body>
    <main class="page">
        <a class="back" href="{{ url_for('chat_page') }}">&larr; Back to chat</a>

        <form id="lesson-form" class="card" autocomplete="off">
            <h1>Lesson Plan Details</h1>

            <input id="document_type" name="document_type" type="hidden" value="lesson_plan">

            <label for="curriculum">Curriculum</label>
            <select id="curriculum" name="curriculum" required>
                <option value="cbc">CBC (Forms)</option>
                <option value="old">Old curriculum (Grades)</option>
            </select>

            <label for="subject">Subject</label>
            <select id="subject" name="subject" required>
                <option value="Physics">Physics</option>
                <option value="Chemistry">Chemistry</option>
                <option value="Biology">Biology</option>
                <option value="Agricultural Science">Agricultural Science</option>
                <option value="Creative Arts">Creative Arts</option>
                <option value="English Language">English Language</option>
                <option value="Civic Education">Civic Education</option>
                <option value="Home Economics">Home Economics</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Additional Mathematics">Additional Mathematics</option>
                <option value="Computer Studies">Computer Studies</option>
                <option value="Computer Studies / ICT">Computer Studies / ICT</option>
                <option value="ICT">ICT</option>
                <option value="Design and Technology">Design and Technology</option>
                <option value="Geography">Geography</option>
                <option value="Business Studies">Business Studies</option>
                <option value="ICT" selected>ICT</option>
            </select>

            <label for="class_name" id="class-label">Class</label>
            <select id="class_name" name="class_name" required>
                <option value="Form 1">Form 1</option>
                <option value="Form 2">Form 2</option>
                <option value="Form 3">Form 3</option>
                <option value="Form 4">Form 4</option>
            </select>

            <label for="duration">Duration</label>
            <select id="duration" name="duration" required>
                <option value="40">40 Minutes</option>
                <option value="60">60 Minutes</option>
                <option value="80" selected>80 Minutes</option>
                <option value="120">120 Minutes</option>
            </select>

            <label for="topic">Topic</label>
            <input id="topic" name="topic" type="text" placeholder="Pick a topic or type one" required>

            <label for="subtopic">Sub-topic</label>
            <input id="subtopic" name="subtopic" type="text" placeholder="Optional">

            <button type="submit" id="generate-btn" class="btn">Generate</button>
            <p id="form-error" class="error" hidden></p>
        </form>

        <section id="preview" class="card" hidden>
            <h1>Review and edit</h1>
            <p class="hint">Change anything you like, then download the Word file.</p>
            <div id="preview-body"></div>
            <div class="download-panel">
                <button type="button" id="download-btn" class="btn primary">Download Word file</button>
                <p id="download-error" class="download-note" hidden></p>
            </div>
        </section>
    </main>

    <script id="cfg" type="application/json">{{ cfg|tojson }}</script>
    <script src="{{ url_for('static', filename='lesson.js') }}"></script>
</body>
</html>
